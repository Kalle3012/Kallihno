<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuschauer-Stadt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --glas: rgba(15, 23, 42, 0.58);
    --glas-rand: rgba(255, 255, 255, 0.14);
    --text: #ffffff;
    --leise: rgba(255, 255, 255, 0.72);
    --verlauf: linear-gradient(135deg, #8b5cf6, #ec4899);
    --u: min(0.8vh, 1.4222vw);  /* Grundeinheit, passt sich der Bildgröße an */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #0f172a;
    color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-size: calc(var(--u) * 1.9);
  }
  body.durchsichtig { background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  .glas {
    background: var(--glas);
    border: 1px solid var(--glas-rand);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius: calc(var(--u) * 2.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }

  /* ---------- Kopf ---------- */
  .kopf {
    position: fixed; top: calc(var(--u) * 2); left: calc(var(--u) * 2); right: calc(var(--u) * 2);
    display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 1.5);
    padding: calc(var(--u) * 1.3) calc(var(--u) * 1.8);
  }
  .marke { display: flex; align-items: center; gap: calc(var(--u) * 1.2); min-width: 0; }
  .logo {
    width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); border-radius: calc(var(--u) * 1.5);
    background: var(--verlauf); display: grid; place-items: center; font-size: calc(var(--u) * 2.8);
    box-shadow: 0 6px 18px rgba(236, 72, 153, 0.45); flex: none;
  }
  .marke h1 {
    margin: 0; font-family: Outfit, Inter, sans-serif; font-weight: 900; letter-spacing: -0.02em;
    font-size: calc(var(--u) * 3); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .marke small { display: block; color: var(--leise); font-weight: 600; font-size: calc(var(--u) * 1.6); margin-top: calc(var(--u) * 0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: calc(var(--u) * 0.8); flex: none; }
  .chip {
    display: flex; align-items: center; gap: calc(var(--u) * 0.6);
    background: rgba(255, 255, 255, 0.1); border-radius: 999px;
    padding: calc(var(--u) * 0.6) calc(var(--u) * 1.2); font-weight: 800; font-size: calc(var(--u) * 1.75);
    white-space: nowrap;
  }
  .punkt { width: calc(var(--u) * 1); height: calc(var(--u) * 1); border-radius: 50%; background: #9ca3af; }
  .punkt.live { background: #ef4444; animation: puls 1.6s infinite; }
  @keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, .7); } 70%, 100% { box-shadow: 0 0 0 calc(var(--u) * 1) rgba(239, 68, 68, 0); } }

  /* ---------- Like-Ziel ---------- */
  .ziel {
    position: fixed; top: calc(var(--u) * 11.5); left: calc(var(--u) * 2); right: calc(var(--u) * 2);
    padding: calc(var(--u) * 1) calc(var(--u) * 1.6);
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: calc(var(--u) * 1.2);
    font-weight: 800; font-size: calc(var(--u) * 1.7);
  }
  .balken { height: calc(var(--u) * 1.4); background: rgba(255, 255, 255, 0.14); border-radius: 999px; overflow: hidden; }
  .balken > i {
    display: block; height: 100%; width: 0%; border-radius: inherit;
    background: linear-gradient(90deg, #f472b6, #fb7185, #fbbf24);
    transition: width 0.6s cubic-bezier(.2, .8, .2, 1);
    box-shadow: 0 0 12px rgba(251, 113, 133, 0.7);
  }
  .ziel .zahl { color: var(--leise); font-variant-numeric: tabular-nums; }

  /* ---------- Rangliste ---------- */
  .rang {
    position: fixed; top: calc(var(--u) * 17.5); left: calc(var(--u) * 2);
    width: calc(var(--u) * 26); padding: calc(var(--u) * 1.3) calc(var(--u) * 1.4);
  }
  .rang h2 {
    margin: 0 0 calc(var(--u) * 0.9); font-size: calc(var(--u) * 1.4); text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--leise); font-weight: 800;
  }
  .rang ol { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 0.8); }
  .rang li { display: grid; grid-template-columns: calc(var(--u) * 2.8) 1fr; gap: calc(var(--u) * 0.8); align-items: center; }
  .platz {
    width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); border-radius: 50%; display: grid; place-items: center;
    font-weight: 900; font-size: calc(var(--u) * 1.4); background: rgba(255, 255, 255, 0.12);
  }
  .rang li:nth-child(1) .platz { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #422006; }
  .rang li:nth-child(2) .platz { background: linear-gradient(135deg, #f1f5f9, #94a3b8); color: #0f172a; }
  .rang li:nth-child(3) .platz { background: linear-gradient(135deg, #fed7aa, #c2410c); color: #431407; }
  .rn { font-weight: 800; font-size: calc(var(--u) * 1.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs { color: var(--leise); font-size: calc(var(--u) * 1.35); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini { height: calc(var(--u) * 0.5); background: rgba(255, 255, 255, 0.12); border-radius: 999px; margin-top: calc(var(--u) * 0.35); overflow: hidden; }
  .mini > i { display: block; height: 100%; background: var(--verlauf); border-radius: inherit; }

  /* ---------- Ereignis-Banner (Bau-Rush / Quiz) ---------- */
  .banner {
    position: fixed; top: calc(var(--u) * 17.5); right: calc(var(--u) * 2); left: calc(var(--u) * 30);
    padding: calc(var(--u) * 1.4) calc(var(--u) * 1.8); border-radius: calc(var(--u) * 2.2);
    font-weight: 800; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
    transform-origin: top center; animation: auf .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  .banner.rush { background: linear-gradient(135deg, #f97316, #facc15); color: #1c1917; }
  .banner.quiz { background: linear-gradient(135deg, #6366f1, #a855f7); }
  .banner.abstimmung { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .option { position: relative; display: grid; grid-template-columns: 1.6em 1fr auto; align-items: center; gap: .5em;
    margin-top: calc(var(--u) * .7); padding: calc(var(--u) * .5) calc(var(--u) * 1); border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
  .option b { display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: #fff; color: #4338ca; z-index: 1; }
  .option span, .option em { z-index: 1; font-style: normal; }
  .option i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.28); transition: width .4s; }
  .hinweis-klein { margin-top: calc(var(--u) * .7); font-size: .8em; opacity: .9; }
  .fanfare { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;
    padding: calc(var(--u) * 2) calc(var(--u) * 3.2); border-radius: calc(var(--u) * 3); background: rgba(15,23,42,.78);
    border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.4);
    animation: fanfare 6.5s ease forwards; max-width: 92vw; }
  .fanfare .f1 { font-weight: 800; font-size: calc(var(--u) * 2.4); opacity: .9; }
  .fanfare .f2 { font-family: Outfit, Inter, sans-serif; font-weight: 900; font-size: calc(var(--u) * 6); line-height: 1.05;
    background: linear-gradient(135deg, #fde68a, #f59e0b, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .fanfare .f3 { font-weight: 700; font-size: calc(var(--u) * 1.9); margin-top: calc(var(--u) * .8); opacity: .9; }
  @keyframes fanfare { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 8% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    12% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.96); } }
  .banner.gewonnen { background: linear-gradient(135deg, #10b981, #22d3ee); color: #052e2b; }
  .banner .titel { font-family: Outfit, Inter, sans-serif; font-weight: 900; font-size: calc(var(--u) * 2.4); display: flex; justify-content: space-between; gap: 1em; white-space: nowrap; }
  .banner .text { font-size: calc(var(--u) * 1.9); margin-top: calc(var(--u) * 0.5); line-height: 1.3; }
  .banner .uhr { font-variant-numeric: tabular-nums; opacity: 0.9; flex: none; }
  @keyframes auf { from { transform: scale(.85) translateY(-10px); opacity: 0; } }

  /* ---------- Unten: Feed + Bürgermeister + Regeln ---------- */
  .unten {
    position: fixed; left: calc(var(--u) * 2); right: calc(var(--u) * 2); bottom: calc(var(--u) * 2);
    display: flex; flex-direction: column; gap: calc(var(--u) * 1.1);
  }
  .feed { display: flex; flex-direction: column; gap: calc(var(--u) * 0.6); align-items: flex-start; }
  .eintrag {
    padding: calc(var(--u) * 0.7) calc(var(--u) * 1.4); border-radius: 999px; max-width: 100%;
    font-size: calc(var(--u) * 1.75); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    animation: rein .4s cubic-bezier(.2, 1.2, .4, 1);
  }
  .eintrag b { font-weight: 800; color: #fde68a; }
  .eintrag.gross { background: var(--verlauf); border-color: transparent; }
  .eintrag.gross b { color: #fff; }
  @keyframes rein { from { transform: translateX(-24px); opacity: 0; } }

  .buergermeister { display: flex; gap: calc(var(--u) * 1.3); align-items: flex-end; }
  .avatar {
    position: relative; flex: none; width: calc(var(--u) * 8.5); height: calc(var(--u) * 8.5);
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 60%, #b45309);
    display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  .avatar svg { width: 82%; height: 82%; }
  .avatar::after {
    content: ''; position: absolute; inset: calc(var(--u) * -0.6); border-radius: 50%;
    border: calc(var(--u) * 0.4) solid rgba(236, 72, 153, 0.9); opacity: 0;
  }
  .avatar.spricht::after { animation: welle 1s ease-out infinite; }
  @keyframes welle { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.18); opacity: 0; } }
  .avatar.spricht .mund { animation: reden .22s infinite alternate; transform-origin: 50px 69px; transform-box: view-box; }
  @keyframes reden { from { transform: scaleY(.4); } to { transform: scaleY(1.2); } }
  .blase {
    position: relative; flex: 1; min-height: calc(var(--u) * 8.5); padding: calc(var(--u) * 1.2) calc(var(--u) * 1.7);
    background: rgba(255, 255, 255, 0.95); color: #0f172a; border-radius: calc(var(--u) * 2.2);
    border-bottom-left-radius: calc(var(--u) * 0.6);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22); transition: opacity .4s, transform .4s;
  }
  .blase .wer {
    font-size: calc(var(--u) * 1.45); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--verlauf); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .blase .was { font-size: calc(var(--u) * 2.15); font-weight: 700; line-height: 1.3; margin-top: calc(var(--u) * 0.3); min-height: 1.3em; }
  .blase.still { opacity: 0.6; transform: scale(.98); }

  .regeln {
    display: flex; justify-content: center; flex-wrap: wrap; gap: calc(var(--u) * 0.6) calc(var(--u) * 1.4);
    padding: calc(var(--u) * 0.9) calc(var(--u) * 1.4); font-size: calc(var(--u) * 1.6); font-weight: 700;
  }
  .regeln span { white-space: nowrap; }
  .regeln b { color: #fde68a; }

  .ton {
    position: fixed; right: calc(var(--u) * 2); top: calc(var(--u) * 16); padding: .5em 1em; border-radius: 999px;
    border: 0; font: inherit; font-weight: 800; background: var(--verlauf); color: #fff; cursor: pointer;
  }
  .versteckt { display: none !important; }
</style>
</head>
<body>
<canvas id="stadt"></canvas>

<header class="kopf glas">
  <div class="marke">
    <div class="logo">🏡</div>
    <div style="min-width:0">
      <h1 id="stadtName">Zuschauer-Stadt</h1>
      <small id="untertitel">Jeder Kommentar baut mit</small>
    </div>
  </div>
  <div class="chips">
    <div class="chip"><span class="punkt" id="livePunkt"></span><span id="zStatus">…</span></div>
    <div class="chip">👀 <span id="zZuschauer">0</span></div>
    <div class="chip">🏠 <span id="zHaeuser">0</span></div>
  </div>
</header>

<div class="ziel glas">
  <span>❤️ Like-Ziel</span>
  <div class="balken"><i id="zielBalken"></i></div>
  <span class="zahl" id="zielZahl">0 / 1.000</span>
</div>

<aside class="rang glas" id="rang">
  <h2>Schönste Häuser</h2>
  <ol id="liste"></ol>
</aside>

<div class="banner versteckt" id="banner"><div class="titel"><span id="bannerTitel"></span><span class="uhr" id="bannerUhr"></span></div><div class="text" id="bannerText"></div></div>

<div class="unten">
  <div class="feed" id="feed"></div>
  <div class="buergermeister">
    <div class="avatar" id="avatar">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="60" rx="26" ry="27" fill="#fde7d4"/>
        <rect x="28" y="12" width="44" height="26" rx="4" fill="#1e1b4b"/>
        <rect x="20" y="34" width="60" height="7" rx="3.5" fill="#1e1b4b"/>
        <rect x="28" y="28" width="44" height="5" fill="#ec4899"/>
        <circle cx="40" cy="56" r="3.6" fill="#1e1b4b"/>
        <circle cx="60" cy="56" r="3.6" fill="#1e1b4b"/>
        <circle cx="34" cy="65" r="4" fill="#fda4af" opacity=".7"/>
        <circle cx="66" cy="65" r="4" fill="#fda4af" opacity=".7"/>
        <path d="M38 47 q12 -5 24 0" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse class="mund" cx="50" cy="69" rx="7" ry="4" fill="#9f1239"/>
      </svg>
    </div>
    <div class="blase still" id="blase">
      <div class="wer" id="wer">Bürgermeister</div>
      <div class="was" id="was">Willkommen in der Stadt!</div>
    </div>
  </div>
  <div class="regeln glas">
    <span>💬 <b>Schreiben</b> = bauen</span>
    <span>❤️ Folgen <b>+5</b></span>
    <span>🎁 Geschenke = <b>Turbo</b></span>
    <span><b>!haus</b> · <b>!stadt</b> · <b>!farbe pink</b></span>
  </div>
</div>

<div class="fanfare versteckt" id="fanfare"><div class="f1"></div><div class="f2"></div><div class="f3"></div></div>

<button class="ton versteckt" id="tonKnopf">🔊 Ton an</button>

<script>
// ============================================================ Einstellungen über die URL
const P = new URLSearchParams(location.search);
const DURCHSICHTIG = P.get('durchsichtig') === '1';
if (DURCHSICHTIG) document.body.classList.add('durchsichtig');
if (P.get('ohneliste') === '1') document.getElementById('rang').classList.add('versteckt');
const MIT_STIMME = P.get('stimme') === '1';
const TAGESZYKLUS_MIN = P.has('tag') ? Number(P.get('tag')) : 8; // Minuten für Tag + Nacht (0 = immer Tag)
const KATALOG = P.get('katalog') === '1';
const FILM = P.get('film') === '1';

// ============================================================ Zustand
const leute = new Map();      // id -> Bewohner vom Server
const anim = new Map();       // id -> Animationszustand
let STUFEN = [];
let spiel = { likeZiel: 1000, likeBasis: 0, likes: 0, rushBis: 0, quiz: null };
let zeitVersatz = 0;          // Serverzeit minus eigene Zeit
const welteffekte = [];       // Konfetti, Staub, Texte (Weltkoordinaten)
const himmelseffekte = [];    // Feuerwerk (Bildschirmkoordinaten)
let spot = null;              // Kamera-Spotlight { id, bis }
let bannerErgebnis = null;    // { text, gewonnen, bis }
const sonderSchilder = [];    // Rathaus und Wahrzeichen
const wahrzeichenStart = {};  // art -> Zeitpunkt, an dem es gebaut wurde (für die Bau-Animation)
function wahrzeichenWachsen(art) {
  const t0 = wahrzeichenStart[art];
  if (!t0) return 1;
  const w = Math.min(1, (performance.now() - t0) / 1200);
  return (1 - Math.pow(1 - w, 3)) + Math.sin(w * Math.PI) * 0.1;
}

// ============================================================ Verbindung zum Programm
function verbinden() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'alles') {
      STUFEN = m.stufen;
      document.getElementById('wer').textContent = m.moderator.name;
      zeigeStats(m.stats); zeigeSpiel(m.spiel);
      if (m.stadt) zeigeStadt(m.stadt);
      if (KATALOG) return katalogZeigen();
      leute.clear(); anim.clear();
      for (const b of m.einwohner) { leute.set(b.id, b); anim.set(b.id, neueAnim(b, true)); }
      listeAktualisieren();
    } else if (KATALOG) return;
    else if (m.t === 'stats') zeigeStats(m.stats);
    else if (m.t === 'spiel') zeigeSpiel(m.spiel);
    else if (m.t === 'bewohner') bewohnerUpdate(m);
    else if (m.t === 'sprich') sprechen(m);
    else if (m.t === 'feuerwerk') feuerwerk(m.staerke || 1);
    else if (m.t === 'stadt') zeigeStadt(m.stadt);
    else if (m.t === 'stadtAufstieg') { zeigeStadt(m.stadt); fanfare(`🏙️ Wir sind jetzt ${m.stadt.artikel || 'eine'}`, m.stadt.stufenName, 'Neu: ' + m.stadt.neu); spot = { ort: [1.5, 1.5], bis: performance.now() + 4500 }; }
    else if (m.t === 'wahrzeichen') {
      wahrzeichenStart[m.art] = performance.now();
      const i = STADT.wahrzeichen.includes(m.art) ? STADT.wahrzeichen.indexOf(m.art) : STADT.wahrzeichen.length;
      const ort = MITTE[i + 1] || MITTE[1];
      fanfare('🏗️ Neues Wahrzeichen', m.name, m.stimmen ? 'Ihr habt abgestimmt!' : '');
      spot = { ort, bis: performance.now() + 5000 };
    }
    else if (m.t === 'quizEnde') {
      bannerErgebnis = { text: m.gewinner ? `✅ ${m.gewinner} wusste es: ${m.antwort}` : `Die Antwort war: ${m.antwort}`, gewonnen: !!m.gewinner, bis: Date.now() + 6000 };
      if (m.gewinner) feuerwerk(1);
    }
  };
  ws.onclose = () => { zeigeStats({ status: 'getrennt', zuschauer: 0 }); setTimeout(verbinden, 2000); };
}

function neueAnim(b, sofort) {
  return { wachsen: sofort ? 1 : 0, wachsenStart: performance.now(), hupf: 0, letzteAktion: 0 };
}

const zahlDE = n => Number(n || 0).toLocaleString('de-DE');
function zeigeStats(s) {
  document.getElementById('zZuschauer').textContent = zahlDE(s.zuschauer);
  const st = { live: 'LIVE', demo: 'DEMO', wartet: 'wartet', verbinde: 'verbinde', getrennt: 'getrennt', beendet: 'Ende', fehler: 'Fehler', startet: '…' };
  document.getElementById('zStatus').textContent = st[s.status] || s.status;
  document.getElementById('livePunkt').classList.toggle('live', s.status === 'live' || s.status === 'demo');
  zuschauerJetzt = s.zuschauer || 0;
}
function zeigeStadt(st) {
  const vorher = STADT.stufe;
  STADT = { ...st };
  // Zum Ausprobieren: ?stadt=0..5 und ?wz=riesenrad,park,brunnen
  if (P.has('stadt')) { STADT.stufe = Math.max(0, Math.min(5, +P.get('stadt'))); STADT.stufenName = ['Siedlung', 'Dorf', 'Kleinstadt', 'Stadt', 'Großstadt', 'Metropole'][STADT.stufe]; }
  if (P.has('wz')) STADT.wahrzeichen = P.get('wz').split(',').filter(w => WAHRZEICHEN_ZEICHNEN[w]);
  st = STADT;
  document.getElementById('stadtName').textContent = st.name;
  document.getElementById('untertitel').textContent = st.naechsterName
    ? `${st.stufenName} · ${zahlDE(st.einwohner)} Einwohner · noch ${zahlDE(st.naechsteAb - st.einwohner)} bis ${st.naechsterName}`
    : `${st.stufenName} · ${zahlDE(st.einwohner)} Einwohner`;
  if (st.stufe !== vorher) farbCache.clear();
}
let fanfareTimer = null;
function fanfare(oben, gross, unten) {
  const el = document.getElementById('fanfare');
  el.querySelector('.f1').textContent = oben;
  el.querySelector('.f2').textContent = gross;

function bewohnerUpdate(m) {

  if (!a) { a = neueAnim(b, false); anim.set(b.id, a); staub(b, 10); }
  a.letzteAktion = performance.now();
  if (m.art === 'kommentar' || m.art === 'like') a.hupf = 1;

  if (m.aufstieg) {
    a.wachsen = 0; a.wachsenStart = performance.now();
    staub(b, 18);

    if (b.stufe >= 2) schwebText(b, '⬆ ' + b.stufenName);
    feed(`🏗️ <b>${esc(b.name)}</b> hat jetzt: ${esc(b.stufenName)}`, b.stufe >= 6);

  } else if (m.art === 'beitritt' && warNeu) {

  } else if (m.art === 'follow') {

  } else if (m.art === 'geschenk') {

function bannerAktualisieren() {

  l.sort((a, b) => (Math.hypot(a[0] - 1.5, a[1] - 1.5) - Math.hypot(b[0] - 1.5, b[1] - 1.5)) || (a[0] - b[0]) || (a[1] - b[1]));

  { belag: '#b08d5e' },                                              // 0 Siedlung: Feldwege
  { belag: '#8f8a85', pflaster: true },                              // 1 Dorf: Kopfsteinpflaster
  { belag: '#4b5563', linie: '#fef3c7' },                            // 2 Kleinstadt: Asphalt
  { belag: '#414957', linie: '#ffffff', zebra: true },               // 3 Stadt: + Zebrastreifen

function strassenBelag(gx, gy) {
  const st = STRASSE[SS()];
  const sx = mod3(gx) === 0, sy = mod3(gy) === 0, kreuzung = sx && sy;
  boden(-.5, -.5, .5, .5, 0, ton(st.belag));
  // Achse der Straße: entlang v (sx) oder entlang u (sy)
  const quer = (a0, a1, b0, b1, z, f) => sx ? boden(a0, b0, a1, b1, z, f) : boden(b0, a0, b1, a1, z, f);
  if (SS() === 0) {                       // Fahrspuren im Sand
    if (!kreuzung) { quer(-.28, -.16, -.5, .5, .1, ton('#9a7a4f')); quer(.16, .28, -.5, .5, .1, ton('#9a7a4f')); }
    return;
  }
  if (st.pflaster) {                      // Pflastersteine
    ctx.strokeStyle = ton('#6b6560', 1, 0.55); ctx.lineWidth = 0.6; ctx.beginPath();
    for (let i = -.4; i <= .41; i += .2) {
      const [a, b] = [Pt(i, -.5), Pt(i, .5)], [c, d] = [Pt(-.5, i), Pt(.5, i)];
      ctx.moveTo(...a); ctx.lineTo(...b); ctx.moveTo(...c); ctx.lineTo(...d);
    }
    ctx.stroke();
    return;
  }
  if (kreuzung) return;
  if (st.rad) quer(.3, .42, -.5, .5, .15, ton('#16a34a', 0.9));                 // Radweg
  if (st.gold) { quer(-.46, -.43, -.5, .5, .2, ton('#fbbf24')); quer(.43, .46, -.5, .5, .2, ton('#fbbf24')); }
  if (st.linie) {                                                              // Mittellinie
    ctx.strokeStyle = ton(st.linie, 1, 0.6); ctx.lineWidth = 1.4; ctx.setLineDash([6, 6]);
    const [a, b] = sx ? [Pt(0, -.5, .2), Pt(0, .5, .2)] : [Pt(-.5, 0, .2), Pt(.5, 0, .2)];
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (st.zebra) {                                                              // Zebrastreifen vor Kreuzungen
    const vor = sx ? mod3(gy - 1) === 0 : mod3(gx - 1) === 0, nach = sx ? mod3(gy + 1) === 0 : mod3(gx + 1) === 0;
    for (const [b0, b1] of [vor ? [-.46, -.26] : null, nach ? [.26, .46] : null].filter(Boolean)) {
      for (let a = -.38; a < .38; a += .13) quer(a, a + .07, b0, b1, .25, ton('#f8fafc', 1, 0.9));
    }
  }
}

function grundstueckBoden() {
  if (SS() === 0) { boden(-.5, -.5, .5, .5, 0, ton('#84cc16', 0.92)); return; }
  if (SS() === 1) { boden(-.5, -.5, .5, .5, 0, ton('#a8a29e')); boden(-.48, -.48, .48, .48, 0.2, ton('#84cc16', 0.95)); return; }
  boden(-.5, -.5, .5, .5, 0, ton(SS() >= 3 ? '#e7e5e4' : '#d6d3d1'));     // Gehweg
  if (SS() >= 3) boden(-.47, -.47, .47, .47, 0.6, ton('#a8a29e'));          // Bordstein
  boden(-.46, -.46, .46, .46, 0.8, ton('#84cc16', 0.95));
}

// Laternen und Straßendeko je Stufe
function leuchten(x, y, farbe, r = 26, staerke = 0.35) {
  if (nacht <= 0.3) return;
  const g = ctx.createRadialGradient(x, y + 10, 0, x, y + 10, r);
  g.addColorStop(0, farbe.replace('A', (staerke * nacht).toFixed(2))); g.addColorStop(1, farbe.replace('A', '0'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y + 10, r, 0, Math.PI * 2); ctx.fill();
}
function stange(u, v, h, farbe, breite = 1.6) {
  const [x0, y0] = Pt(u, v, 0), [x1, y1] = Pt(u, v, h);
  ctx.strokeStyle = ton(farbe); ctx.lineWidth = breite; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  return [x1, y1];
}
function lampe(u, v, stil) {
  if (stil === 1) {                                   // Holzlaterne
    const [x, y] = stange(u, v, 15, '#78350f', 2);
    ctx.fillStyle = nacht > 0.3 ? '#fdba74' : ton('#fde68a'); ctx.fillRect(x - 2.2, y - 4, 4.4, 4.5);
    leuchten(x, y, 'rgba(253,186,116,A)', 22, 0.45);
  } else if (stil === 2) {                            // klassische Straßenlaterne
    const [x, y] = stange(u, v, 22, '#1f2937', 1.8);
    ctx.fillStyle = ton('#1f2937'); ctx.fillRect(x - 3, y - 1.5, 6, 2);
    ctx.fillStyle = nacht > 0.3 ? '#fde68a' : ton('#e2e8f0'); ctx.beginPath(); ctx.arc(x, y + 2, 2.6, 0, Math.PI * 2); ctx.fill();
    leuchten(x, y, 'rgba(253,230,138,A)');
  } else if (stil === 3) {                            // moderne Laterne mit Ausleger
    const [x, y] = stange(u, v, 26, '#64748b', 1.8);
    ctx.strokeStyle = ton('#64748b'); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 7, y + 3); ctx.stroke();
    ctx.fillStyle = nacht > 0.3 ? '#ffffff' : ton('#cbd5e1'); ctx.fillRect(x - 10, y + 2, 5, 2);
    leuchten(x - 7, y + 2, 'rgba(255,255,255,A)', 28, 0.3);
  } else if (stil === 4) {                            // LED-Laterne
    const [x, y] = stange(u, v, 28, '#e2e8f0', 1.5);
    ctx.strokeStyle = nacht > 0.3 ? '#a5f3fc' : ton('#94a3b8'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, y, 4.5, 2, 0, 0, Math.PI * 2); ctx.stroke();
    leuchten(x, y, 'rgba(165,243,252,A)', 30, 0.35);
  } else if (stil === 5) {                            // goldene Prachtlaterne
    const [x, y] = stange(u, v, 26, '#d97706', 2.2);
    ctx.strokeStyle = ton('#d97706'); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x - 6, y + 2); ctx.lineTo(x + 6, y + 2); ctx.stroke();
    for (const d of [-6, 6]) { ctx.fillStyle = nacht > 0.3 ? '#fef3c7' : ton('#fde68a'); ctx.beginPath(); ctx.arc(x + d, y, 2.8, 0, Math.PI * 2); ctx.fill(); }
    leuchten(x, y, 'rgba(251,191,36,A)', 32, 0.4);
  }
}
function busch(u, v, s = 1) {
  const [x, y] = Pt(u, v, 3 * s);
  ctx.fillStyle = ton('#4d7c0f'); ctx.beginPath(); ctx.arc(x, y, 5 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ton('#65a30d'); ctx.beginPath(); ctx.arc(x - 1.5 * s, y - 1.5 * s, 3.5 * s, 0, Math.PI * 2); ctx.fill();
}
function bank(u, v, entlangV) {
  if (entlangV) { kasten(u - .03, v - .08, u + .03, v + .08, 2, 3.5, '#92400e'); kasten(u - .035, v - .08, u - .02, v + .08, 3.5, 7, '#78350f'); }
  else { kasten(u - .08, v - .03, u + .08, v + .03, 2, 3.5, '#92400e'); kasten(u - .08, v - .035, u + .08, v - .02, 3.5, 7, '#78350f'); }
}
function kuebel(u, v) {
  kasten(u - .03, v - .03, u + .03, v + .03, 0, 4, '#e5e7eb');
  const [x, y] = Pt(u, v, 6);
  ctx.fillStyle = ton('#ec4899'); ctx.beginPath(); ctx.arc(x - 1.5, y, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ton('#facc15'); ctx.beginPath(); ctx.arc(x + 1.5, y - .5, 1.8, 0, Math.PI * 2); ctx.fill();
}
function strassenDeko(gx, gy) {
  const s = SS();
  const sx = mod3(gx) === 0, sy = mod3(gy) === 0;
  if (sx && sy) {                                          // Kreuzung
    if (s === 0) { if ((gx + gy) % 2 === 0) busch(.4, .4, .9); return; }
    lampe(.4, .4, s);
    if (s >= 4) kuebel(-.4, -.4);
    return;
  }
  const a = ((gx + gy) % 2 + 2) % 2 === 0, entlangV = sx;
  const rand = (p, q) => entlangV ? [p, q] : [q, p];       // Position quer/längs zur Straße
  if (s === 0) { if (a) busch(...rand(.44, .1), .7); return; }
  if (a) {
    if (s >= 2) baum(...rand(.44, .15), .75);
    if (s >= 3) bank(...rand(-.43, -.05), entlangV);
  } else if (s >= 3) {
    lampe(...rand(-.44, .2), s);
    if (s >= 4) kuebel(...rand(.44, -.2));
  }

function rathaus() {
  const s = SS();

      ctx.fillRect(e.x, e.y, 3, 1.5 + Math.abs(Math.sin(e.dreh)) * 2);
    } else if (e.art === 's') {
      e.x += e.vx * dt / 16; e.y += e.vy * dt / 16; e.r += dt / 120; e.leben -= dt / 900;
      ctx.globalAlpha = Math.max(0, e.leben) * 0.5; ctx.fillStyle = '#e7e5e4';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    } else {
      e.y -= 0.45 * dt / 16; e.leben -= dt / 2400;
      ctx.globalAlpha = Math.max(0, Math.min(1, e.leben * 2.5));
      const gr = Math.max(7, 11 / kamera.zoom * 1.25);
      ctx.font = `900 ${gr}px Outfit, Inter, sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = gr / 3.5; ctx.strokeStyle = 'rgba(15,23,42,.75)'; ctx.lineJoin = 'round'; ctx.strokeText(e.text, e.x, e.y);
      ctx.fillStyle = '#fde68a'; ctx.fillText(e.text, e.x, e.y);
    }
    if (e.leben <= 0) welteffekte.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

function himmelZeichnen(dt) {
  for (let i = himmelseffekte.length - 1; i >= 0; i--) {
    const e = himmelseffekte[i];
    if (e.art === 'rakete') {
      e.y += e.vy * dt / 16;
      ctx.fillStyle = e.farbe; ctx.beginPath(); ctx.arc(e.x, e.y, 2.5, 0, Math.PI * 2); ctx.fill();
      if (e.y <= e.ziel) {
        himmelseffekte.splice(i, 1);
        for (let j = 0; j < 60; j++) {
          const w = j / 60 * Math.PI * 2, v = 2 + Math.random() * 3.5;
          himmelseffekte.push({ art: 'funke', x: e.x, y: e.y, vx: Math.cos(w) * v, vy: Math.sin(w) * v, leben: 1, farbe: e.farbe });
        }
      }
    } else {
      e.x += e.vx * dt / 16; e.y += e.vy * dt / 16; e.vx *= 0.985; e.vy = e.vy * 0.985 + 0.05 * dt / 16; e.leben -= dt / 1600;
      ctx.globalAlpha = Math.max(0, e.leben); ctx.fillStyle = e.farbe;
      ctx.beginPath(); ctx.arc(e.x, e.y, 2.2, 0, Math.PI * 2); ctx.fill();
      if (e.leben <= 0) himmelseffekte.splice(i, 1);
    }
  }
  ctx.globalAlpha = 1;
}

// Namensschilder: wer gerade schreibt zuerst, dann die schönsten Häuser. Keine Überlappungen.
function namen(liste, t) {
  const MAX = 16;
  const gr = Math.max(7, 12 / Math.max(.45, kamera.zoom) * 1.05);
  ctx.font = `800 ${gr}px Inter, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const kandidaten = liste.map(b => {
    const a = anim.get(b.id);
    const aktiv = a.letzteAktion && t - a.letzteAktion < 6000;
    return { b, aktiv, wert: aktiv ? 1e12 + a.letzteAktion : b.punkte };
  }).sort((p, q) => q.wert - p.wert);
  const belegt = [], zeichnen = [];
  const ueberlappt = r => belegt.some(o => r.x < o.x + o.w && o.x < r.x + r.w && r.y < o.y + o.h && o.y < r.y + r.h);
  for (const so of sonderSchilder) {
    const w = ctx.measureText(so.text).width + gr * 1.1, h = gr * 1.6;
    const r = { x: so.x - w / 2, y: so.y - h, w, h };
    for (let i = 0; i < 4 && ueberlappt(r); i++) r.y -= h * 1.1;   // Sonderschilder nach oben ausweichen
    belegt.push(r); zeichnen.push({ b: { name: so.text }, r, x: so.x, sonder: true });
  }
  for (const k of kandidaten) {
    if (zeichnen.length >= MAX) break;
    const [x, y] = weltPunkt(k.b, 8);
    const text = k.b.name + ((k.b.tage || 0) >= 3 ? ' ⭐' : '');
    const w = ctx.measureText(text).width + gr * 1.1, h = gr * 1.6;
    const r = { x: x - w / 2, y: y - h, w, h };
    if (belegt.some(o => r.x < o.x + o.w && o.x < r.x + r.w && r.y < o.y + o.h && o.y < r.y + r.h)) continue;
    belegt.push(r); zeichnen.push({ ...k, r, x, text });
  }
  for (const z of zeichnen.reverse()) {
    if (z.aktiv) {
      const g = ctx.createLinearGradient(z.r.x, 0, z.r.x + z.r.w, 0);
      g.addColorStop(0, '#8b5cf6'); g.addColorStop(1, '#ec4899');
      ctx.fillStyle = g;
    } else ctx.fillStyle = z.sonder ? 'rgba(180,83,9,.85)' : 'rgba(15,23,42,.72)';
    rundesRechteck(z.r.x, z.r.y, z.r.w, z.r.h, z.r.h / 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(z.text || z.b.name, z.x, z.r.y + z.r.h / 2 + gr * 0.05);
  }
  ctx.textBaseline = 'alphabetic';
}
function rundesRechteck(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// Vorschau aller Stufen nebeneinander: http://localhost:3000/?katalog=1
function katalogZeigen() {
  leute.clear(); anim.clear();
  STUFEN.forEach((st, i) => {
    const b = { id: 'katalog' + i, name: `${i + 1}. ${st.name}`, platz: i, stufe: i, punkte: 0, stufenName: st.name, farbe: '#8b5cf6' };
    leute.set(b.id, b); anim.set(b.id, neueAnim(b, true));
  });
  listeAktualisieren();
}

// Film-Modus für Werbevideos: keine Verbindung, das Drehbuch steuert die Stadt (?film=1)
if (FILM) {
  STUFEN = ['Papierhütte', 'Holzhütte', 'Gartenhäuschen', 'Tiny House', 'Bungalow', 'Einfamilienhaus', 'Modernes Haus',
    'Haus mit Pool', 'Designer-Villa', 'Luxusvilla', 'Prachtvilla', 'Riesen-Villa'].map((name, i) => ({ name, ab: [0, 2, 5, 9, 14, 21, 30, 42, 58, 80, 110, 150][i] }));
  for (const sel of ['.kopf', '.ziel', '.rang', '.regeln', '#banner']) document.querySelector(sel).classList.add('versteckt');
  zeigeStats({ status: 'demo', zuschauer: 0 });
  const filmLeute = new Map();
  let platz = 0;
  const senden = (b, art, text, aufstieg) => bewohnerUpdate({ b: { ...b, stufenName: STUFEN[b.stufe].name }, art, text, aufstieg });
  window.film = {
    neu(name, farbe) {
      const b = { id: name, name, platz: platz++, stufe: 0, punkte: 0, farbe: farbe || null };
      filmLeute.set(name, b); senden(b, 'beitritt', '');
    },
    kommentar(name, text) { const b = filmLeute.get(name); b.punkte++; senden(b, 'kommentar', text); },
    stufe(name, stufe) { const b = filmLeute.get(name); b.stufe = stufe; b.punkte = STUFEN[stufe].ab; senden(b, 'kommentar', '', true); },
    follow(name) { const b = filmLeute.get(name); b.folgt = true; senden(b, 'follow', ''); },
    sprich(text, dauer) { sprechen({ name: 'Bürgermeister Bo', text, dauer: dauer || 1800 + text.length * 45 }); },
    feuerwerk(n) { feuerwerk(n || 2); },
    stadt(stufe, wahrzeichen = []) { zeigeStadt({ ...STADT, stufe, stufenName: ['Siedlung', 'Dorf', 'Kleinstadt', 'Stadt', 'Großstadt', 'Metropole'][stufe], wahrzeichen }); }
  };
} else {
  verbinden();
}
if (P.has('stadt')) zeigeStadt({ ...STADT });
requestAnimationFrame(schleife);
